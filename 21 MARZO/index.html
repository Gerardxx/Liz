<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Para Liz</title>
    <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@700&family=Nunito:wght@400;700&display=swap" rel="stylesheet">
    
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #aad45c;
            overflow: hidden;
            font-family: 'Nunito', sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            user-select: none;
        }

        #heart-bg {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: -1; 
            pointer-events: none;
        }

        .heart-float {
            position: absolute;
            bottom: -50px;
            opacity: 0.6;
            animation: floatUp linear forwards;
        }

        @keyframes floatUp {
            0% {
                transform: translateY(0) rotate(0deg);
                opacity: 0;
            }
            10% { opacity: 0.6; }
            90% { opacity: 0.6; }
            100% {
                transform: translateY(-110vh) rotate(360deg);
                opacity: 0;
            }
        }

        .text-container {
            text-align: center;
            z-index: 10;
            position: relative;
            padding: 20px;
            border-radius: 30px;
        }

        .gif-container {
            margin: 20px auto;
            cursor: pointer;
            transition: transform 0.2s;
            width: fit-content;
        }

        .gif-container:active { transform: scale(0.9); }
        
        .gif-container img {
            max-width: 200px;
            border-radius: 20px;
            box-shadow: 0 10px 20px rgba(0,0,0,0.1);
            display: block;
        }

        h1 { font-family: 'Caveat', cursive; font-size: 4rem; color: #000000; margin: 0; }
        h2 { font-size: 1.4rem; color: #000000; margin: 10px 0; }

        #flower-field {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 5;
        }

        .flower {
            position: absolute;
            font-size: 2rem;
            animation: explode 2s ease-out forwards;
        }

         footer{
            position:fixed;
    bottom:15px;
    font-size:14px;
    color:#000000;
    opacity:0.8;
    letter-spacing:1px;
}

footer span{
    color:var(--primary);
    font-weight:600;
}

        @keyframes explode {
            0% { transform: translate(-50%, -50%) scale(0); opacity: 1; }
            100% {
                transform: translate(calc(-50% + var(--x)), calc(-50% + var(--y))) scale(1.5) rotate(var(--r));
                opacity: 0;
            }
        }
    </style>
</head>
<body>

    <div id="heart-bg"></div>

    <div id="flower-field"></div>

    <div class="text-container">
        <h1>Para Ti</h1>
        
        <div class="gif-container" onclick="explotarFlores(event)">
            <img src="https://media.giphy.com/media/6e1Oh3EZYS9EMUaKQl/giphy.gif" alt="Regalo">
        </div>

        <h2>Haz click en el Sapito :p</h2>
        <p>Porque quererte fue la decision mas facil que he tomado</p>
    </div>
    <script>
        // --- LÓGICA DE CORAZONES DE FONDO ---
        const heartBg = document.getElementById('heart-bg');
        const heartEmojis = ['🌻', '🌻', '🌻', '🌻'];

        function createHeart() {
            const heart = document.createElement('div');
            heart.className = 'heart-float';
            heart.innerText = heartEmojis[Math.floor(Math.random() * heartEmojis.length)];
            
            heart.style.left = Math.random() * 100 + 'vw';
            heart.style.fontSize = (Math.random() * 1 + 1) + 'rem';
            
            const duration = Math.random() * 5 + 5; // Entre 5 y 10 segundos
            heart.style.animationDuration = duration + 's';
            
            heartBg.appendChild(heart);

            setTimeout(() => { heart.remove(); }, duration * 1000);
        }

        setInterval(createHeart, 300);

        const flowerField = document.getElementById('flower-field');
        const flowerEmojis = ['🌻', '💐', '💛', '🌹'];

        function explotarFlores(e) {
            const cantidad = 25;
            const rect = e.currentTarget.getBoundingClientRect();
            const startX = rect.left + rect.width / 2;
            const startY = rect.top + rect.height / 2;

            for (let i = 0; i < cantidad; i++) {
                const flower = document.createElement('div');
                flower.className = 'flower';
                flower.innerText = flowerEmojis[Math.floor(Math.random() * flowerEmojis.length)];
                
                flower.style.left = startX + 'px';
                flower.style.top = startY + 'px';

                const angle = Math.random() * Math.PI * 2;
                const dist = 100 + Math.random() * 200; 
                const x = Math.cos(angle) * dist + 'px';
                const y = Math.sin(angle) * dist + 'px';
                const r = (Math.random() * 360) + 'deg';

                flower.style.setProperty('--x', x);
                flower.style.setProperty('--y', y);
                flower.style.setProperty('--r', r);

                flowerField.appendChild(flower);
                setTimeout(() => { flower.remove(); }, 2000);
            }
        }
    </script>
</body>
<footer>
    Hecho por <span>Gerardxx</span>
</footer>

</html>
